title: "Parmesangratinerad torskrygg med pressad potatis"
ingredients:
  Torsk:
    - Torskrygg:
        amount: 600
        unit: g
    - Grana padano:
        amount: 75
        unit: g
    - Crème fraiche:
        amount: 1
        unit: dl
    - Mjölk:
        amount: 0.5
        unit: dl
    - Vitlök:
        amount: 1
        unit: klyfta
    - Salt:
        amount: 0.5
        unit: tsk
    - Svartpeppar:
        amount: 1
        unit: krm
  Tillbehör:
    - Potatis:
        amount: 700
        unit: g
    - Sugarsnaps:
        amount: 150
        unit: g
    - Purjolök:
        amount: 0.5
        unit: st
    - Smör:
        amount: 1
        unit: msk
    - Salt:
        amount: 1
        unit: krm
    - Svartpeppar:
        amount: 1
        unit: krm

instructions:
  Torsk:
    - Lägg torskrygg i en ugnsform, toppa med ost- och crème fraîche-blandning.
    - Gratinera i ugnen på 175°C i 15-20 minuter.
  Tillbehör:
    - Koka potatisen tills den är mjuk. Fräs purjolök och sugarsnaps i smör.
    - Servera torsken med pressad potatis och grönsaker.

time:
  amount: 35
  unit: min
servings: 4
source: "https://www.tasteline.com/recept/parmesangratinerad-torskrygg-med-pressad-potatis/"
