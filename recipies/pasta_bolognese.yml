instructions:
  Bolognese:
    - Stek löken och vitlöken i olivolja tills de är mjuka.
    - Tillsätt blandfärs och bryn tills den är genomstekt.
    - Tillsätt morot, krossade tomater, tomatpuré och oxfond.
    - Krydda med salt, peppar och låt sjuda i 20 minuter.
    - Avsluta med färsk basilika innan servering.
  Pasta:
    - Koka pastan enligt anvisningarna på förpackningen.
    - Servera pastan med bolognese-såsen.

