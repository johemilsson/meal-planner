instructions:
  Torskrygg:
    - Lägg torsken i en kastrull och täck med vatten. Ta ur torsken, koka upp vattnet med 4-5 msk salt.
    - Lägg i torsken, koka upp i 5-10 sekunder, täck med lock och låt stå i 6-7 minuter.
  Parmesanhollandaise:
    - Smält smöret. Vispa äggulor med lite vatten och citronsaft tills de blir fasta.
    - Tillsätt dijonsenap och vitvinsvinäger. Vispa på svag värme.
    - När smör och äggulor har samma temperatur, vispa försiktigt i smöret.
    - Smaksätt med salt, peppar, parmesan, cayennepeppar och till sist räkorna.
  Tillbehör:
    - Servera torskryggen med kokt potatis och riven pepparrot.

time:
  amount: 30
  unit: min
servings: 4
