instructions:
  Tacofärs:
    - Stek nötfärsen i en panna tills den är genomstekt.
    - Tillsätt spiskummin, paprikapulver och anchochilipulver. Rör om och låt steka i några minuter.
  Aguacate:
    - Mosa avokadon i en skål.
    - Tillsätt limejuice, olivolja, salt och svartpeppar. Blanda väl.
  Tortillas:
    - Värm tortillabröden i ugn på 125 grader.
    - Hacka grönsakerna.
    - Fyll tortillabröden med tacofärs, guacamole, majs, hackade grönsaker, riven ost, gräddfil och tacosås.
time: 
  amount: 30
  unit: min
servings: 4
