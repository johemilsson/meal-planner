instructions:
  Pasta med kyckling:
    - Koka pastan enligt anvisningarna på förpackningen.
    - Skär kycklingen i bitar och stek den i olivolja tillsammans med vitlök.
    - Tillsätt grädde och låt sjuda tills kycklingen är genomstekt.
    - Blanda pastan med kycklingen och såsen.
    - Tillsätt parmesan, salt, peppar och färsk basilika innan servering.

