title: "Kycklinggryta med nudlar"
ingredients:
  Kycklinggryta:
    - Kycklingfilé:
        amount: 600
        unit: g
    - Röd paprika:
        amount: 2
        unit: st
    - Purjolök:
        amount: 0.5
        unit: st
    - Minimajs:
        amount: 425
        unit: g
    - Ingefära:
        amount: 1
        unit: msk
    - Sweet chilisås:
        amount: 0.5
        unit: dl
    - Japansk soja:
        amount: 2
        unit: msk
    - Vatten:
        amount: 0.5
        unit: dl
    - Olja:
        amount: 1
        unit: msk
    - Salt:
        amount: 1
        unit: tsk
    - Svartpeppar:
        amount: 1
        unit: krm
  Nudlar:
    - Äggnudlar:
        amount: 300
        unit: g
instructions:
  - Sätt på en kastrull med vatten till nudlarna.
  - Dela, kärna ur och strimla paprikan. Ansa och skiva purjolöken. Låt minimajsen rinna av. Skala och riv ingefäran.
  - Blanda sweet chili, soja, ingefära och vatten.
  - Stek kycklingen i oljan i en stekpanna på hög värme tills det får fin färg. Salta och peppra.
  - Sänk värmen och blanda ner paprika och purjolök, låt det fräsa någon minut. Vänd ner minimajsen och sweet chiliblandningen. Låt allt bli varmt.
  - Koka nudlarna enligt anvisningen på förpackningen men spola dem inte kalla.
  - Servera genast.
time:
  amount: 45
  unit: min
servings: 4
source: "https://www.ica.se/recept/kycklingwok-med-nudlar-719467"