title: "Salmón al horno con salsa de hierbas"
ingredients:
  Lax:
    - Laxfilé:
        amount: 1
        unit: kg
    - Citron:
        amount: 0.5
        unit: st
    - Citronpeppar:
        amount: 0.25
        unit: tsk
    - Sal:
        amount:
        unit:
  Örtsås:
    - Vatten:
        amount: 2
        unit: dl
    - Creme fraiche:
        amount: 1
        unit: dl
    - Fiskfond:
        amount: 0.5
        unit: msk
    - Grädde:
        amount: 1.5
        unit: dl
    - Dill:
        amount: 2
        unit: msk
    - Gräslök:
        amount: 2
        unit: msk
    - Dragon:
        amount: 0.5
        unit: tsk
    - Maizena:
