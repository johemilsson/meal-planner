        amount:
        unit:
    - Pimienta:
        amount:
        unit:

instructions:
  Lax:
    - Värm ugnen till 225°C.
    - Lägg laxen i en ugnsfast form.
    - Häll citronjuice över laxen, salta och peppra med citronpeppar.
    - Grädda laxen i ugnen i ca 15 minuter eller tills innertemperaturen är ca 50°C (låt sedan laxen vila några minuter).
  Örtsås:
    - Koka upp vatten och creme fraiche.
    - Tillsätt fiskfonden.
    - Tillsätt grädde, dill, gräslök och låt koka upp.
    - Red såsen med maizena.
    - Smaka av med salt och peppar.
time:
  amount: 30
  unit: min
servings: 4
