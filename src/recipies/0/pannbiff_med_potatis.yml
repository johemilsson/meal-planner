instructions:
  Pannbiff:
    - Blanda havregryn och mjölk, låt svälla i 5 minuter.
    - Tillsätt blandfärs, lök, ägg, salt och peppar. Blanda ordentligt och forma till biffar.
    - Stek biffarna i smör tills de är genomstekta.
  Tillbehör:
    - Koka potatisen tills den är mjuk.
    - Servera biffarna med kokt potatis, lingonsylt och gräddsås.
  Brunsås:
    - Smält smöret i en kastrull. Vispa ner mjölet och låt det fräsa en minut.
    - Tillsätt vatten och oxfond lite i taget under vispning för att undvika klumpar.
    - Häll i grädden och låt sjuda i cirka 5 minuter.
    - Smaksätt med soja, salt och peppar efter smak. Låt såsen koka upp igen och tjockna något.

time:
  amount: 45
  unit: min
servings: 4
