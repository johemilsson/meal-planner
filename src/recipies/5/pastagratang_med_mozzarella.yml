title: "Pastagratäng med mozzarella"
ingredients:
  Köttfärsröra:
    - Gul lök:
        amount: 1
        unit: st
    - Vitlök:
        amount: 1
        unit: klyfta
    - Köttfärs:
        amount: 500
        unit: g
    - Krossade tomater:
        amount: 400
        unit: g
    - Tomatpuré:
        amount: 1
        unit: msk
    - Creme fraiche:
        amount: 2
        unit: dl
    - Sambal oelek:
        amount: 1
        unit: tsk
    - Salt:
        amount: 1
        unit: tsk
    - Svartpeppar:
        amount: 1
        unit: krm
    - Smör:
        amount: 1
        unit: msk
    - Körsbärstomater:
        amount: 50
        unit: g
    - Timjan:
        amount: 1
        unit: krm
  Pasta:
    - Pasta:
        amount: 400
        unit: g
    - Körsbärstomater:
        amount: 50
        unit: g
    - Mozzarella:
        amount: 3
        unit: dl

instructions:
  - Sätt ugnen på 225°C.  
  - Koka pastan enligt anvisningarna på förpackningen.
  - Hacka löken och vitlöken.
  - Fräs hacket i smör i en stor stekpanna, lägg i färsen och bryn tills den fått färg och smular sig, använd en gaffel att röra med.
  - Tillsätt krossade tomater, tomatpuré och creme fraiche, låt puttra i 10 \- 20 minuter.
  - Tillsätt sambal oelek, salt och svartpeppar.
  - Toppa eventuellt med körsbärstomater och timjan.
  - Blanda i pastan och häll i en ugnssäker form.
  - Klyfta körsbärstomaterna och fördela dem över röran. Strö över mozzarellan.
  - Gratinera i ugnen i 20 minuter eller tills gratängen har fått fin färg.
  - Toppa eventuellt med halverade körsbärstomater och timjan och servera med en god och krispig sallad.

time: 50 min
servings: 4
source: "https://www.koket.se/pastagratang-med-mozzarella"